{% extends "base.html" %}
{% block content %}
<h1>JSON アップロード</h1>
<section class="card">
  <p>internal-accounting の <strong>JSONエクスポート</strong>ボタンで出力したファイルをアップロードしてください。</p>
  <form method="post" enctype="multipart/form-data" class="form">
    <label>JSONファイル<input type="file" name="file" accept="application/json" required /></label>
    <div class="actions">
      <button type="submit" class="btn primary">読み込んで分析</button>
      {% if loaded %}<a class="btn ghost" href="{{ url_for('dashboard') }}">既存データで続行</a>{% endif %}
    </div>
  </form>
  <p class="muted small">複数期間分の実績が入っているほど統計検証が意味を持ちます（最低 4 期以上推奨）。</p>
</section>
{% endblock %}
